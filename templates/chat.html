<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenAI Chatbot - DevOps Demo</title>
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .chat-container {
      width: 500px;
      margin: 40px auto;
      background: #1e293b;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    .chat-box {
      height: 300px;
      overflow-y: scroll;
      border: 1px solid #334155;
      padding: 10px;
      background: #0f172a;
      border-radius: 8px;
    }
    .user { color: #38bdf8; }
    .bot { color: #22c55e; }
    input {
      width: 80%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <h1>🤖 GenAI Chatbot</h1>
    <div class="chat-box" id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Ask your DevOps question..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value.trim();
      if (!message) return;

      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `<p class='user'><strong>You:</strong> ${message}</p>`;
      input.value = "";

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await response.json();

      chatBox.innerHTML += `<p class='bot'><strong>Bot:</strong> ${data.reply}</p>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
