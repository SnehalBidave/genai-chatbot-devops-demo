<!DOCTYPE html>
<html>
<head>
    <title>GenAI Chatbot Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        #chatbox { width: 100%; height: 400px; border: 1px solid #ccc; padding: 10px; overflow-y: scroll; }
        .user { color: blue; margin: 5px; }
        .bot { color: green; margin: 5px; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>
    <h2>🤖 GenAI Chatbot</h2>
    <div id="chatbox"></div>
    <input id="message" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            let msg = document.getElementById("message").value;
            if (!msg.trim()) return;

            let chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<div class="user"><b>You:</b> ${msg}</div>`;
            document.getElementById("message").value = "";

            let response = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: msg})
            });

            let data = await response.json();
            chatbox.innerHTML += `<div class="bot"><b>Bot:</b> ${data.reply}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
