<!DOCTYPE html>
<html>
<head>
    <title>GenAI DevOps Chatbot</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        textarea { width: 100%; height: 80px; }
        input[type=submit] { padding: 10px 20px; }
        .reply { margin-top: 20px; background: #f1f1f1; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>GenAI DevOps Chatbot</h1>
    <form method="post" action="/ask">
        <textarea name="user_input" placeholder="Ask a DevOps question..."></textarea><br>
        <input type="submit" value="Send">
    </form>
    {% if reply %}
    <div class="reply">
        <strong>You:</strong> {{ user_input }}<br>
        <strong>Bot:</strong> {{ reply }}
    </div>
    {% endif %}
</body>
</html>
